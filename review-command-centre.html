function vNt(){const by={};W.forEach(w=>{w.d.forEach(x=>x[1].forEach((t,i)=>{const k=dk({date:x[0]},i);if(S.done[k])(by[S.done[k]]=by[S.done[k]]||[]).push(w.t+": "+t)}));w.l.forEach((t,i)=>{const k=lk(w,i);if(S.done[k])(by[S.done[k]]=by[S.done[k]]||[]).push(w.t+" (Hour 3): "+t)})});
const txt=Object.keys(by).sort().map(d=>"Last Reviewed "+d+"\n"+by[d].map(x=>"- "+x).join("\n")).join("\n\n")||"Nothing ticked yet.";
return `<div class="card"><h2>Notion update list</h2><p class="sub">Items you ticked, grouped by the date you ticked them. Use it to update Reading Status and Last Reviewed on the matching Hub rows. This page cannot write to Notion.</p><textarea id="nt" readonly aria-label="Notion update list">${esc(txt)}</textarea><div class="row" style="margin-top:8px"><button data-copy="nt">Copy list</button></div></div>
<div class="card"><h2>Back up your progress</h2><p class="sub">Progress is saved in this browser only. Copy the text below to keep a backup; paste a backup here and load it to restore.</p><textarea id="bk" aria-label="Backup">${esc(JSON.stringify(S))}</textarea><div class="row" style="margin-top:8px"><button data-copy="bk">Copy backup</button><button data-load>Load from box</button></div></div>`}
function draw(){nav();overall();$("#v").innerHTML={today:vToday,plan:vPlan,obj:vObj,nt:vNt}[tab]()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const D=b.dataset;
if(D.tab){tab=D.tab}else if(D.go!==undefined){cur=days[+D.go].date}else if("jump"in D){cur=(days.find(d=>d.date>=t0)||days[days.length-1]).date}
else if(D.day){cur=D.day;tab="today"}else if(D.snap!==undefined){snap=+D.snap}
else if(D.r){const[k,v]=D.r.split("|");if(S.rate[snap][k]==v)delete S.rate[snap][k];else S.rate[snap][k]=v;save()}
else if(D.copy){const t=$("#"+D.copy);t.select();try{navigator.clipboard.writeText(t.value)}catch(x){document.execCommand&&document.execCommand("copy")}return}
else if("load"in D){try{const x=JSON.parse($("#bk").value);if(x&&x.done&&x.rate){S=x;save()}}catch(x){alert("That text is not a valid backup.")}}
else return;draw()});
document.addEventListener("change",e=>{const k=e.target.dataset.k;if(!k)return;if(e.target.checked)S.done[k]=ymd(new Date());else delete S.done[k];save();overall()});
document.addEventListener("input",e=>{if(e.target.id=="note"){S.note=e.target.value;save()}});
document.addEventListener("keydown",e=>{if(tab!="today"||/TEXTAREA|INPUT/.test(e.target.tagName))return;const i=days.findIndex(d=>d.date===cur);if(e.key=="ArrowRight"&&i<days.length-1){cur=days[i+1].date;draw()}if(e.key=="ArrowLeft"&&i>0){cur=days[i-1].date;draw()}});
draw();
</script></body></html>
