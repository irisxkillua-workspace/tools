    <style>
        /* Base Reset & Custom Touch Styles */
        body {
            background-color: #FAF7F2;
            color: #3E362E;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            font-feature-settings: "palt";
        }
        
        /* Smooth Accordion Transitions */
        .accordion-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .accordion-content.expanded {
            grid-template-rows: 1fr;
        }
        .accordion-inner {
            overflow: hidden;
            min-height: 0;
        }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        .animate-fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

        /* Checkbox Ripple & Animation */
        .custom-checkbox {
            transition: all 0.2s ease;
        }
        .custom-checkbox.checked {
            background-color: #6B8E78;
            border-color: #6B8E78;
        }
        .custom-checkbox.checked svg {
            opacity: 1;
            transform: scale(1);
        }

        /* Hide Scrollbars smoothly */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Bottom Sheet Drawer Animation */
        #mask-drawer-backdrop {
            transition: opacity 0.3s ease;
        }
        #mask-drawer-panel {
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans antialiased selection:bg-sage/20 selection:text-sage-dark min-h-screen pb-24">

    <!-- Safe Area Header Gap for iOS Notch -->
    <div class="pt-safe sticky top-0 z-30 bg-oat-base/90 backdrop-blur-md border-b border-oat-border/60">
        <!-- Header Title Bar -->
        <header class="px-5 pt-4 pb-3 flex justify-between items-end max-w-md mx-auto">
            <div>
                <span class="text-xs tracking-widest text-cocoa-muted font-serif block mb-0.5">SINGAPORE SKINCARE ROUTINE</span>
                <h1 class="text-2xl font-bold font-serif text-cocoa tracking-wide">護膚保養指南</h1>
            </div>
            <div class="text-right">
                <span id="current-date-text" class="text-xs font-serif text-cocoa-muted block">-- 月 -- 日</span>
                <button onclick="resetTodayChecklist()" class="text-[11px] text-sage hover:text-sage-dark underline underline-offset-2 transition-colors mt-0.5">
                    重置今日進度
                </button>
            </div>
        </header>

        <!-- Horizontal Scrollable Day Selector -->
        <nav class="px-4 py-2.5 max-w-md mx-auto overflow-x-auto no-scrollbar flex space-x-2">
            <!-- Dynamic Buttons generated by JS -->
            <div id="day-buttons-container" class="flex space-x-2 w-full justify-between min-w-full"></div>
        </nav>
    </div>

    <!-- Main Scrollable Content Container -->
    <main class="flex-1 max-w-md w-full mx-auto px-5 pt-4 space-y-5">

        <!-- Evening Focus / Night Task Badge Card -->
        <section class="bg-oat-card rounded-2xl p-4 border border-oat-border shadow-sm transition-all duration-300">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-sage"></span>
                    <span id="theme-badge" class="font-serif font-bold text-sm text-cocoa tracking-wide">【載入中】</span>
                </div>
                <span id="climate-tag" class="text-[11px] bg-oat-base text-cocoa-muted px-2.5 py-1 rounded-full border border-oat-border">
                    41歲 混合肌 ‧ 新加坡
                </span>
            </div>
            <p id="theme-desc" class="text-xs text-cocoa-muted mt-2 leading-relaxed">
                正在根據你的居住環境與皮膚狀況調整保養頻率...
            </p>
        </section>

        <!-- AM / PM Segmented Toggle Control -->
        <section class="bg-oat-border/40 p-1 rounded-2xl flex relative">
            <button id="toggle-am" onclick="switchTimeOfDay('am')" 
                    class="flex-1 py-2.5 rounded-xl text-sm font-medium transition-all duration-300 flex items-center justify-center space-x-1.5 z-10">
                <span class="text-base">☀️</span>
                <span class="font-serif tracking-wide">早上流程</span>
            </button>
            <button id="toggle-pm" onclick="switchTimeOfDay('pm')" 
                    class="flex-1 py-2.5 rounded-xl text-sm font-medium transition-all duration-300 flex items-center justify-center space-x-1.5 z-10">
                <span class="text-base">🌙</span>
                <span class="font-serif tracking-wide">晚上流程</span>
            </button>
        </section>

        <!-- Dynamic Mask Alert Banner (Shown if mask helper active in PM) -->
        <div id="mask-active-banner" class="hidden bg-sage-light border border-sage-border rounded-2xl p-3.5 text-xs text-cocoa leading-relaxed animate-fade-in flex items-start space-x-2.5">
            <span class="text-base flex-shrink-0">🌿</span>
            <div class="flex-1">
                <div class="font-bold text-sage-dark font-serif text-sm mb-0.5" id="mask-banner-title">今晚敷面膜調整中</div>
                <div id="mask-banner-desc" class="text-cocoa-muted">已自動為你暫停衝突的高濃度成分，並更新流程順序。</div>
            </div>
            <button onclick="clearMaskSelection()" class="text-cocoa-muted hover:text-cocoa text-xs underline flex-shrink-0">取消</button>
        </div>

        <!-- Routine Step Cards List -->
        <div id="steps-container" class="space-y-3.5">
            <!-- Step cards rendered via JS -->
        </div>

        document.addEventListener('DOMContentLoaded', () => {
            cleanupStorage();
            renderDateHeader();
            renderDayButtons();
            syncUI();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) return;
            Object.keys(T).forEach(id => { if (T[id].state === 'running') tick(id); });
            if (dateStr() !== shownDate) {            // page left open past midnight
                shownDate = dateStr();
                selectedDay = todayDay(); timeOfDay = autoTod(); selectedMask = 'none';
                renderDateHeader(); renderDayButtons(); syncUI();
            }
        });

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMaskDrawer(); });

        // ---------- Header & day selector ----------
        function renderDateHeader() {
            const t = new Date();
            const zh = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
            document.getElementById('current-date-text').textContent = `${t.getMonth() + 1} 月 ${t.getDate()} 日 (${zh[t.getDay()]})`;
        }

        function renderDayButtons() {
            const box = document.getElementById('day-buttons-container');
            box.innerHTML = '';
            [1, 2, 3, 4, 5, 6, 0].forEach(n => {
                const sel = n === selectedDay, isToday = n === todayDay();
                const btn = document.createElement('button');
                btn.onclick = () => selectDay(n);
                btn.setAttribute('aria-pressed', sel);
                btn.setAttribute('aria-label', DAYS[n].name + (isToday ? '（今天）' : ''));
                btn.className = `flex-1 py-2 px-1 rounded-xl text-xs font-serif transition-all duration-200 flex flex-col items-center justify-center space-y-0.5 ${
                    sel ? 'bg-sage text-white font-bold shadow-md shadow-sage/20 scale-105'
                        : 'bg-oat-card text-cocoa-muted hover:bg-oat-hover border border-oat-border'}`;
                // dot = today marker (white on the selected button)
                btn.innerHTML = `<span>${DAYS[n].name}</span><span class="w-1 h-1 rounded-full ${isToday ? (sel ? 'bg-white' : 'bg-sage') : 'bg-transparent'}"></span>`;
                box.appendChild(btn);
            });
        }

        function selectDay(n) {
            selectedDay = n;
            selectedMask = 'none';        // a mask choice belongs to one night only
            renderDayButtons();
            syncUI();
        }

        function switchTimeOfDay(tod) { timeOfDay = tod; syncUI(); }

        function syncUI() {
            const ON = "flex-1 py-2.5 rounded-xl text-sm font-bold text-sage-dark bg-oat-card shadow-sm border border-oat-border/80 transition-all duration-300 flex items-center justify-center space-x-1.5 z-10 font-serif";
            const OFF = "flex-1 py-2.5 rounded-xl text-sm font-medium text-cocoa-muted hover:text-cocoa transition-all duration-300 flex items-center justify-center space-x-1.5 z-10 font-serif";
            const am = document.getElementById('toggle-am'), pm = document.getElementById('toggle-pm');
            am.className = timeOfDay === 'am' ? ON : OFF;
            pm.className = timeOfDay === 'pm' ? ON : OFF;
            am.setAttribute('aria-pressed', timeOfDay === 'am');
            pm.setAttribute('aria-pressed', timeOfDay === 'pm');

            const d = DAYS[selectedDay];
            document.getElementById('theme-badge').textContent = d.badge;
            document.getElementById('theme-desc').textContent =
                d.desc + (selectedDay === todayDay() ? '' : '（非今日，僅供預覽，不可勾選）');
            render();
        }

        // ---------- Step building ----------
        function buildSteps() {
            let steps = DAYS[selectedDay][timeOfDay].map(spec => {
                const [pid, note] = Array.isArray(spec) ? spec : [spec];
                const p = PRODUCTS[pid];
                return { id: `${selectedDay}-${timeOfDay}-${pid}`, name: p.name, summary: p.sum,
                         detail: note ? `${note} ${p.detail}` : p.detail, timer: p.timer || 0, tags: p.tags };
            });
            const removed = [];
            if (timeOfDay === 'pm' && selectedMask !== 'none') {
                const M = MASKS[selectedMask];
                steps = steps.filter(s => {
                    const clash = s.tags.some(t => M.pause.includes(t));
                    if (clash) removed.push(s.name);
                    return !clash;
                });
                // Mask goes right after cleansing; only after Salicylic Acid if that step is first
                const at = (selectedMask === 'hydrating' && steps[0] && steps[0].tags.includes('bha')) ? 1 : 0;
                steps.splice(at, 0, { id: `${selectedDay}-pm-mask-${selectedMask}`, name: M.step.name, summary: M.step.sum,
                                      detail: M.step.detail, timer: M.step.timer, tags: [] });
            }
            steps.forEach((s, i) => s.num = i + 1);
            return { steps, removed };
        }

        function render() {
            const { steps, removed } = buildSteps();
            renderSteps(steps);
            updateMaskBannerUI(removed);
        }

        function renderSteps(steps) {
            const box = document.getElementById('steps-container');
            box.innerHTML = '';
            const isToday = selectedDay === todayDay();
            const saved = isToday ? loadChecks() : {};

            steps.forEach(step => {
                const done = !!saved[step.id];
                const open = expanded.has(step.id);
                const card = document.createElement('div');
                card.className = `bg-oat-card border border-oat-border rounded-2xl overflow-hidden transition-all duration-200 shadow-sm ${done ? 'opacity-75 bg-oat-base/60' : ''}`;
                card.innerHTML = `
                    <div class="p-4 flex items-center justify-between cursor-pointer select-none space-x-3" onclick="toggleAccordion('${step.id}')">
                        <button onclick="event.stopPropagation(); toggleCheck('${step.id}')" ${isToday ? '' : 'disabled'}
                                aria-label="完成：${step.name}" aria-pressed="${done}"
                                class="custom-checkbox flex-shrink-0 w-6 h-6 rounded-full border-2 border-sage/60 flex items-center justify-center transition-all ${done ? 'checked' : 'bg-transparent'} ${isToday ? '' : 'opacity-40 cursor-not-allowed'}">
                            <svg class="w-3.5 h-3.5 text-white opacity-0 transform scale-75 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                            </svg>
                        </button>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center space-x-2">
                                <span class="font-serif text-xs font-bold text-sage-dark bg-sage-light px-2 py-0.5 rounded-md">${step.num}</span>
                                <h4 class="font-serif font-bold text-sm text-cocoa truncate ${done ? 'line-through text-cocoa-muted' : ''}">${step.name}</h4>
                            </div>
                            <p class="text-xs text-cocoa-muted truncate mt-1 ${done ? 'line-through opacity-75' : ''}">${step.summary}</p>
                        </div>
                        <div class="flex-shrink-0 text-cocoa-muted transition-transform duration-300" id="arrow-${step.id}" style="transform:rotate(${open ? 180 : 0}deg)">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </div>
                    </div>
                    <div id="drawer-${step.id}" class="accordion-content ${open ? 'expanded' : ''}">
                        <div class="accordion-inner">
                            <div class="px-4 pb-4 pt-3 border-t border-oat-border/50 text-xs text-cocoa leading-relaxed space-y-3 bg-oat-base/40">
                                <p class="text-cocoa-muted">${step.detail}</p>
                                ${step.timer > 0 ? `
                                <div class="flex items-center justify-between bg-oat-card p-2.5 rounded-xl border border-oat-border">
                                    <div class="flex items-center space-x-2">
                                        <span class="text-sm">⏱</span>
                                        <span class="font-serif font-medium text-cocoa" id="timer-label-${step.id}"></span>
                                    </div>
                                    <button onclick="event.stopPropagation(); timerAction('${step.id}')" id="timer-btn-${step.id}" data-total="${step.timer}"></button>
                                </div>` : ''}
                            </div>
                        </div>
                    </div>`;
                box.appendChild(card);
                if (step.timer > 0) paintTimer(step.id);
            });
        }

        function toggleAccordion(id) {
            const drawer = document.getElementById(`drawer-${id}`);
            const arrow = document.getElementById(`arrow-${id}`);
            const open = !drawer.classList.contains('expanded');
            drawer.classList.toggle('expanded', open);
            arrow.style.transform = `rotate(${open ? 180 : 0}deg)`;
            open ? expanded.add(id) : expanded.delete(id);
        }

        // ---------- Check state (only today's routine can be ticked) ----------
        const checkKey = tod => `sc_${dateStr()}_${tod}`;

        function loadChecks() {
            try { return JSON.parse(localStorage.getItem(checkKey(timeOfDay)) || '{}'); } catch { return {}; }
        }

        function toggleCheck(id) {
            if (selectedDay !== todayDay()) return;
            const saved = loadChecks();
            saved[id] = !saved[id];
            try { localStorage.setItem(checkKey(timeOfDay), JSON.stringify(saved)); } catch {}
            render();
        }

        function resetTodayChecklist() {
            try { ['am', 'pm'].forEach(t => localStorage.removeItem(checkKey(t))); } catch {}
            render();
        }

        function cleanupStorage() {   // drop legacy keys and anything older than 14 days
            try {
                const now = Date.now();
                Object.keys(localStorage).forEach(k => {
                    if (k.startsWith('skincare_check_')) { localStorage.removeItem(k); return; }
                    const m = k.match(/^sc_(\d+)-(\d+)-(\d+)_/);
                    if (m && now - new Date(+m[1], +m[2] - 1, +m[3]).getTime() > 14 * 864e5) localStorage.removeItem(k);
                });
            } catch {}
        }

        // ---------- Timer (end-timestamp based, survives re-render and screen lock) ----------
        const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
        const remainingOf = t => Math.max(0, Math.ceil((t.endAt - Date.now()) / 1000));

        function paintTimer(id) {
            const label = document.getElementById(`timer-label-${id}`);
            const btn = document.getElementById(`timer-btn-${id}`);
            if (!label || !btn) return;
            const t = T[id], total = Number(btn.dataset.total);
            const base = 'px-3 py-1.5 rounded-lg text-xs font-serif text-white transition-colors ';
            if (!t) {
                label.textContent = `建議靜置/敷用 ${Math.round(total / 60)} 分鐘`;
                btn.textContent = '啟動計時'; btn.className = base + 'bg-sage hover:bg-sage-dark';
            } else if (t.state === 'running') {
                label.textContent = `剩餘時間：${fmt(t.remaining)}`;
                btn.textContent = '暫停'; btn.className = base + 'bg-terracotta';
            } else if (t.state === 'paused') {
                label.textContent = `已暫停：${fmt(t.remaining)}`;
                btn.textContent = '繼續'; btn.className = base + 'bg-sage hover:bg-sage-dark';
            } else {
                label.textContent = '✨ 時間到！請進行下一步驟';
                btn.textContent = '重設'; btn.className = base + 'bg-sage-dark';
            }
        }

        function tick(id) {
            const t = T[id];
            t.remaining = remainingOf(t);
            if (t.remaining <= 0) { clearInterval(t.handle); t.state = 'done'; alertDone(); }
            paintTimer(id);
        }

        function timerAction(id) {
            unlockAudio();                // iOS only allows audio after a tap
            const t = T[id];
            const total = Number(document.getElementById(`timer-btn-${id}`).dataset.total);
            if (!t) {
                T[id] = { state: 'running', remaining: total, endAt: Date.now() + total * 1000 };
                T[id].handle = setInterval(() => tick(id), 500);
            } else if (t.state === 'running') {
                clearInterval(t.handle); t.remaining = remainingOf(t); t.state = 'paused';
            } else if (t.state === 'paused') {
                t.state = 'running'; t.endAt = Date.now() + t.remaining * 1000;
                t.handle = setInterval(() => tick(id), 500);
            } else {
                delete T[id];
            }
            paintTimer(id);
        }

        function unlockAudio() {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch {}
        }

        function alertDone() {
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            if (!audioCtx) return;
            [0, 0.35, 0.7].forEach(delay => {
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.frequency.value = 880; g.gain.value = 0.15;
                o.connect(g); g.connect(audioCtx.destination);
                o.start(audioCtx.currentTime + delay); o.stop(audioCtx.currentTime + delay + 0.2);
            });
        }

        // ---------- Mask drawer ----------
        function openMaskDrawer() {
            document.getElementById('mask-drawer').classList.remove('pointer-events-none');
            document.getElementById('mask-drawer-backdrop').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('mask-drawer-panel').classList.remove('translate-y-full');
        }

        function closeMaskDrawer() {
            document.getElementById('mask-drawer-backdrop').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('mask-drawer-panel').classList.add('translate-y-full');
            setTimeout(() => document.getElementById('mask-drawer').classList.add('pointer-events-none'), 350);
        }

        function selectMaskOption(key) {
            selectedMask = key;
            closeMaskDrawer();
            timeOfDay = 'pm';
            syncUI();
        }

        function clearMaskSelection() { selectedMask = 'none'; syncUI(); }

        function updateMaskBannerUI(removed) {
            const banner = document.getElementById('mask-active-banner');
            const badge = document.getElementById('current-mask-badge');
            if (timeOfDay !== 'pm' || selectedMask === 'none') {
                banner.classList.add('hidden'); badge.classList.add('hidden');
                return;
            }
            const M = MASKS[selectedMask];
            let desc;
            if (!M.pause.length) desc = '原定步驟全部保留。面膜後請以清水洗去膠體，並待皮膚完全乾爽再繼續。';
            else if (removed.length) desc = `已暫停：${removed.join('、')}。其餘步驟保留。`;
            else desc = '今晚課表本來就沒有 Salicylic Acid / Retinol，無需調整，其餘步驟照舊。';
            document.getElementById('mask-banner-title').textContent = M.title;
            document.getElementById('mask-banner-desc').textContent = desc;
            badge.textContent = M.badge;
            banner.classList.remove('hidden'); badge.classList.remove('hidden');
        }
    </script>
</body>
</html>
