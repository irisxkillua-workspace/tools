<!DOCTYPE html>

<head>

    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="護膚指南">

                            border: '#C3D4C9'

                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'sans-serif']

    <style>
        /* Base Reset & Custom Touch Styles */
        body {
            background-color: #FAF7F2;
            color: #3E362E;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            font-feature-settings: "palt";
        }
        
        /* Smooth Accordion Transitions */
        .accordion-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .accordion-content.expanded {
            grid-template-rows: 1fr;
        }
        .accordion-inner {
            overflow: hidden;
        }

        /* Checkbox Ripple & Animation */
        .custom-checkbox {
            transition: all 0.2s ease;
        }
        .custom-checkbox.checked {
            background-color: #6B8E78;
            border-color: #6B8E78;
        }
        .custom-checkbox.checked svg {
            opacity: 1;
            transform: scale(1);
        }

        /* Hide Scrollbars smoothly */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Bottom Sheet Drawer Animation */
        #mask-drawer-backdrop {
            transition: opacity 0.3s ease;
        }
        #mask-drawer-panel {
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

</head>
<body class="h-full flex flex-col font-sans antialiased selection:bg-sage/20 selection:text-sage-dark min-h-screen pb-24">

    <!-- Safe Area Header Gap for iOS Notch -->
    <div class="pt-safe sticky top-0 z-30 bg-oat-base/90 backdrop-blur-md border-b border-oat-border/60">
        <!-- Header Title Bar -->
        <header class="px-5 pt-4 pb-3 flex justify-between items-end max-w-md mx-auto">
            <div>
                <span class="text-xs tracking-widest text-cocoa-muted font-serif block mb-0.5">SINGAPORE SKINCARE ROUTINE</span>
                <h1 class="text-2xl font-bold font-serif text-cocoa tracking-wide">護膚保養指南</h1>
            </div>
            <div class="text-right">
                <span id="current-date-text" class="text-xs font-serif text-cocoa-muted block">-- 月 -- 日</span>
                <button onclick="resetTodayChecklist()" class="text-[11px] text-sage hover:text-sage-dark underline underline-offset-2 transition-colors mt-0.5">
                    重置今日進度
                </button>
            </div>
        </header>

        <!-- Horizontal Scrollable Day Selector -->
        <nav class="px-4 py-2.5 max-w-md mx-auto overflow-x-auto no-scrollbar flex space-x-2">
            <!-- Dynamic Buttons generated by JS -->
            <div id="day-buttons-container" class="flex space-x-2 w-full justify-between min-w-full"></div>
        </nav>
    </div>

    <!-- Main Scrollable Content Container -->
    <main class="flex-1 max-w-md w-full mx-auto px-5 pt-4 space-y-5">

        <!-- Evening Focus / Night Task Badge Card -->
        <section class="bg-oat-card rounded-2xl p-4 border border-oat-border shadow-sm transition-all duration-300">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-sage"></span>
                    <span id="theme-badge" class="font-serif font-bold text-sm text-cocoa tracking-wide">【載入中】</span>
                </div>
                <span id="climate-tag" class="text-[11px] bg-oat-base text-cocoa-muted px-2.5 py-1 rounded-full border border-oat-border">
                    41歲 混合肌 ‧ 新加坡
                </span>
            </div>
            <p id="theme-desc" class="text-xs text-cocoa-muted mt-2 leading-relaxed">
                正在根據你的居住環境與皮膚狀況調整保養頻率...
            </p>
        </section>

        <!-- AM / PM Segmented Toggle Control -->
        <section class="bg-oat-border/40 p-1 rounded-2xl flex relative">
            <button id="toggle-am" onclick="switchTimeOfDay('am')" 
                    class="flex-1 py-2.5 rounded-xl text-sm font-medium transition-all duration-300 flex items-center justify-center space-x-1.5 z-10">
                <span class="text-base">☀️</span>
                <span class="font-serif tracking-wide">早上流程</span>
            </button>
            <button id="toggle-pm" onclick="switchTimeOfDay('pm')" 
                    class="flex-1 py-2.5 rounded-xl text-sm font-medium transition-all duration-300 flex items-center justify-center space-x-1.5 z-10">
                <span class="text-base">🌙</span>
                <span class="font-serif tracking-wide">晚上流程</span>
            </button>
        </section>

        <!-- Dynamic Mask Alert Banner (Shown if mask helper active in PM) -->
        <div id="mask-active-banner" class="hidden bg-sage-light border border-sage-border rounded-2xl p-3.5 text-xs text-cocoa leading-relaxed animate-fade-in flex items-start space-x-2.5">
            <span class="text-base flex-shrink-0">🌿</span>
            <div class="flex-1">
                <div class="font-bold text-sage-dark font-serif text-sm mb-0.5" id="mask-banner-title">今晚敷面膜調整中</div>
                <div id="mask-banner-desc" class="text-cocoa-muted">已自動為你暫停衝突的高濃度成分，並更新流程順序。</div>
            </div>
            <button onclick="clearMaskSelection()" class="text-cocoa-muted hover:text-cocoa text-xs underline flex-shrink-0">取消</button>
        </div>

        <!-- Routine Step Cards List -->
        <div id="steps-container" class="space-y-3.5">
            <!-- Step cards rendered via JS -->
        </div>

        <!-- Singapore Climate Care Advice Footer Box -->
        <section class="bg-oat-card/70 border border-oat-border rounded-2xl p-4 text-xs text-cocoa-muted space-y-2 mt-6">
            <div class="font-serif font-bold text-cocoa flex items-center space-x-1.5">
                <svg class="w-4 h-4 text-sage" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span>新加坡保養黃金法則</span>
            </div>
            <p class="leading-relaxed">
                在高溫高濕環境與冷氣房內交替，請保持**「早C抗氧化、晚A重修護、T字分區刷酸」**的節奏。補水精華要在微濕臉時擦，擦完面膜建議以清水潑洗多餘膠體以防止搓泥。
            </p>
        </section>
    </main>

    <!-- Floating Bottom Sheet Trigger Button: 面膜小幫手 -->
    <div id="floating-helper-container" class="fixed bottom-6 left-0 right-0 z-20 px-5 max-w-md mx-auto pointer-events-none">

                class="pointer-events-auto w-full bg-sage hover:bg-sage-dark text-white font-serif py-3.5 px-5 rounded-full shadow-lg shadow-sage/30 flex items-center justify-center space-x-2 transition-all duration-300 active:scale-95">
            <span class="text-base">🌿</span>
            <span class="tracking-widest font-medium text-sm">面膜小幫手</span>
            <span id="current-mask-badge" class="bg-white/20 text-xs px-2 py-0.5 rounded-full font-sans ml-1 hidden">已設定</span>
        </button>
    </div>

    <!-- Mask Drawer Bottom Sheet Modal -->

             class="absolute inset-0 bg-cocoa/40 opacity-0 pointer-events-none backdrop-blur-sm"></div>

        <!-- Sliding Panel -->
        <div id="mask-drawer-panel" 
             class="absolute bottom-0 left-0 right-0 max-w-md mx-auto bg-oat-card border-t border-oat-border rounded-t-3xl p-6 shadow-2xl transform translate-y-full pointer-events-auto max-h-[85vh] overflow-y-auto">
            
            <div class="w-12 h-1 bg-oat-border rounded-full mx-auto mb-5"></div>

            <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 class="font-serif font-bold text-xl text-cocoa">面膜智慧小幫手</h3>
                    <p class="text-xs text-cocoa-muted mt-1">選擇你今晚想敷的面膜類型，系統將自動調整保養順序與避雷防線。</p>
                </div>
                <button onclick="closeMaskDrawer()" class="text-cocoa-muted hover:text-cocoa p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Mask Options List -->
            <div class="space-y-3 my-4">
                <button onclick="selectMaskOption('none')" 
                        class="mask-opt-btn w-full text-left p-4 rounded-2xl border border-oat-border bg-oat-base hover:border-sage transition-all flex items-start space-x-3">
                    <span class="text-xl">🍃</span>
                    <div class="flex-1">
                        <div class="font-bold text-sm text-cocoa font-serif">今晚不敷面膜</div>
                        <div class="text-xs text-cocoa-muted mt-0.5">恢復當天原定保養課表步驟。</div>
                    </div>
                </button>

                <button onclick="selectMaskOption('hydrating')" 
                        class="mask-opt-btn w-full text-left p-4 rounded-2xl border border-oat-border bg-oat-base hover:border-sage transition-all flex items-start space-x-3">
                    <span class="text-xl">💧</span>
                    <div class="flex-1">
                        <div class="font-bold text-sm text-cocoa font-serif">純補水 / 舒緩修護面膜</div>
                        <div class="text-xs text-cocoa-muted mt-0.5">含玻尿酸、B5、積雪草等。適合週日修護夜或冷氣房乾燥時。</div>
                    </div>
                </button>

                <button onclick="selectMaskOption('clay')" 
                        class="mask-opt-btn w-full text-left p-4 rounded-2xl border border-oat-border bg-oat-base hover:border-sage transition-all flex items-start space-x-3">
                    <span class="text-xl">🌋</span>
                    <div class="flex-1">
                        <div class="font-bold text-sm text-cocoa font-serif">清潔泥膜 / 深層淨化面膜</div>
                        <div class="text-xs text-cocoa-muted mt-0.5">含高嶺土、火山泥。將自動取消當晚水楊酸與 A 醇，避免過度剝脫。</div>
                    </div>
                </button>

                <button onclick="selectMaskOption('active')" 
                        class="mask-opt-btn w-full text-left p-4 rounded-2xl border border-oat-border bg-oat-base hover:border-sage transition-all flex items-start space-x-3">
                    <span class="text-xl">✨</span>
                    <div class="flex-1">
                        <div class="font-bold text-sm text-cocoa font-serif">美白 / 抗老 / 機能型片狀面膜</div>
                        <div class="text-xs text-cocoa-muted mt-0.5">活性成分濃度高。將自動暫停 A 醇與酸類，直接補水＋乳液鎖水。</div>
                    </div>
                </button>
            </div>

            <div class="pt-2">
                <button onclick="closeMaskDrawer()" class="w-full py-3 bg-oat-border/40 hover:bg-oat-border/60 text-cocoa font-medium text-xs rounded-xl transition-colors">
                    關閉選單
                </button>
            </div>
        </div>
    </div>

        // Accordion Collapse / Expand Toggle

            const drawer = document.getElementById(`drawer-${id}`);
            const arrow = document.getElementById(`arrow-${id}`);

            if (drawer.classList.contains('expanded')) {
                drawer.classList.remove('expanded');

            } else {
                drawer.classList.add('expanded');
                arrow.style.transform = 'rotate(180deg)';
            }
        }

        function getTodayStorageKey() {
            const today = new Date();
            const dateStr = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
            return `skincare_check_${dateStr}_day${selectedDay}_${timeOfDay}`;
        }

        function toggleCheck(id) {
            const todayKey = getTodayStorageKey();
            const savedChecks = JSON.parse(localStorage.getItem(todayKey) || '{}');
            
            savedChecks[id] = !savedChecks[id];
            localStorage.setItem(todayKey, JSON.stringify(savedChecks));

            renderStepsCards();

            const todayKey = getTodayStorageKey();
            localStorage.removeItem(todayKey);
            renderStepsCards();

        // Integrated Mini Timer Feature inside Cards
        function startTimer(id, secondsTotal) {
            const btn = document.getElementById(`timer-btn-${id}`);
            const label = document.getElementById(`timer-label-${id}`);

            if (activeTimers[id]) {
                clearInterval(activeTimers[id]);
                delete activeTimers[id];
                btn.textContent = '重新計時';
                btn.className = 'bg-sage hover:bg-sage-dark text-white px-3 py-1.5 rounded-lg text-xs font-serif transition-colors';
                label.textContent = `建議靜置/敷用 ${Math.floor(secondsTotal / 60)} 分鐘`;
                return;
            }

            let remaining = secondsTotal;
            btn.textContent = '暫停';
            btn.className = 'bg-terracotta hover:bg-terracotta/90 text-white px-3 py-1.5 rounded-lg text-xs font-serif transition-colors';

            activeTimers[id] = setInterval(() => {
                remaining--;
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                label.textContent = `剩餘時間：${mins}:${secs < 10 ? '0' : ''}${secs}`;

                if (remaining <= 0) {
                    clearInterval(activeTimers[id]);
                    delete activeTimers[id];
                    label.textContent = '✨ 時間到！請進行下一步驟';
                    btn.textContent = '完成';
                    btn.className = 'bg-sage-dark text-white px-3 py-1.5 rounded-lg text-xs font-serif';
                    
                    // Simple Haptic vibration feedback if supported
                    if (navigator.vibrate) {
                        navigator.vibrate([200, 100, 200]);

            const bannerDesc = document.getElementById('mask-banner-desc');
            const currentBadge = document.getElementById('current-mask-badge');

            if (timeOfDay === 'pm' && selectedMask !== 'none') {
                banner.classList.remove('hidden');
                currentBadge.classList.remove('hidden');

                if (selectedMask === 'hydrating') {
                    bannerTitle.textContent = "已插入：💧 純補水/舒緩面膜";
                    bannerDesc.textContent = "原定精華正常保留，敷 10-15 分鐘後建議清水洗去表面膠體再擦 A 醇。";
                    currentBadge.textContent = "補水面膜";
                } else if (selectedMask === 'clay') {
                    bannerTitle.textContent = "已調整：🌋 清潔泥膜特別夜";
                    bannerDesc.textContent = "已為你自動隱藏當晚水楊酸與 A 醇，避免過度破壞角質屏障。";
                    currentBadge.textContent = "清潔泥膜";
                } else if (selectedMask === 'active') {
                    bannerTitle.textContent = "已調整：✨ 機能型片狀面膜夜";
                    bannerDesc.textContent = "已暫停 A 醇與酸類，敷後請以清水洗去殘膠，並以 CeraVe PM 乳液鎖水。";
                    currentBadge.textContent = "機能面膜";
                }
            } else {
                banner.classList.add('hidden');
                currentBadge.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
