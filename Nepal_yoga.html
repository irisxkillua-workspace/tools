<!DOCTYPE html>
<html lang="zh-Hant" data-theme="scheme4">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>尼泊爾正宗瑜伽・隨身查詢寶典</title>
  <style>
    /* ==================== 正式版配色：方案四 #4 FEMININE & FASHIONABLE + 現代無襯線字體 ==================== */
    :root, [data-theme="scheme4"] {
      --font-heading: -apple-system, BlinkMacSystemFont, "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
      --radius-card: 18px;
      --radius-pill: 999px;
      --bg-primary: #FCF1EF;
      --bg-secondary: #F4F4F4;
      --bg-card: #FFFFFF;
      --bg-card-hover: #FFFDFC;
      --bg-header: rgba(252, 241, 239, 0.95);
      --bg-accent-soft: rgba(242, 170, 152, 0.28);
      --bg-tag: #F4F4F4;
      --tag-text: #000000;
      --text-primary: #000000;
      --text-secondary: #3A3A3A;
      --text-muted: #767676;
      --accent-primary: #000000;
      --accent-secondary: #F2AA98;
      --cues-border: #F2AA98;
      --border-color: #BFBFBF;
      --shadow-card: 0 6px 20px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 12px 28px rgba(242, 170, 152, 0.34);
      --hero-gradient: linear-gradient(135deg, #000000 0%, #262626 42%, #F2AA98 100%);
      --hero-text: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
      line-height: 1.65;
      padding-bottom: 90px;
    }

    /* ==================== 主視覺橫幅 ==================== */
    .hero-banner {
      background: var(--hero-gradient);
      color: var(--hero-text);
      padding: 28px 20px 24px;
      position: relative;
      overflow: hidden;
    }

    .hero-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.18);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      width: fit-content;
      letter-spacing: 0.5px;
    }

    .hero-title {
      font-family: var(--font-heading);
      font-size: clamp(1.5rem, 3.8vw, 2.15rem);
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .hero-subtitle {
      font-size: 0.92rem;
      opacity: 0.94;
      max-width: 920px;
    }

    /* ==================== 桌面導覽與全域搜尋列 ==================== */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .top-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-tab {
      background: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: var(--radius-pill);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-card);
      font-family: var(--font-body);
    }

    .nav-tab:hover {
      border-color: var(--accent-primary);
      color: var(--text-primary);
    }

    .nav-tab.active {
      background: var(--accent-primary);
      color: #FFFFFF;
      border-color: var(--accent-primary);
    }

    .nav-count {
      font-size: 0.73rem;
      padding: 1px 8px;
      border-radius: 999px;
      background: rgba(242, 170, 152, 0.3);
      color: inherit;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      max-width: 360px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 10px 38px 10px 16px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.9rem;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-primary);
    }

    .search-clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      display: none;
    }

    /* ==================== 次分類篩選膠囊 ==================== */
    .sub-filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 18px;
      scrollbar-width: thin;
    }

    .filter-chip {
      white-space: nowrap;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 0.84rem;
      font-weight: 500;
      font-family: var(--font-body);
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-chip:hover {
      border-color: var(--accent-primary);
    }

    .filter-chip.active {
      background: var(--bg-accent-soft);
      color: var(--text-primary);
      border-color: var(--accent-primary);
      font-weight: 700;
    }

    /* ==================== 卡片網格與體式圖片 ==================== */
    .section-view {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .section-view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 20px;
    }

    .yoga-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition: all 0.22s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .yoga-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent-primary);
    }

    .card-img-wrap {
      width: 100%;
      height: 235px;
      background: #F8EFEA;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .yoga-card:hover .card-img-wrap img {
      transform: scale(1.03);
    }

    .img-source-tag {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.72);
      color: #FFFFFF;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }

    .card-body-inner {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .card-cat-badge {
      font-size: 0.73rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background: var(--bg-tag);
      color: var(--tag-text);
      white-space: nowrap;
      border: 1px solid #E2E2E2;
    }

    .card-title {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .card-sanskrit {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .card-summary {
      font-size: 0.86rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .cues-preview {
      background: var(--bg-primary);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      border-left: 4px solid var(--cues-border);
    }

    .cues-preview-title {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .cues-list-inline {
      font-size: 0.82rem;
      color: var(--text-primary);
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
    }

    .chakra-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
      align-items: center;
      justify-content: space-between;
    }

    .chakra-pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .chakra-dot-pill {
      font-size: 0.73rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .more-link {
      font-size: 0.8rem;
      color: var(--accent-primary);
      font-weight: 700;
      white-space: nowrap;
    }

    /* ==================== 序列步驟卡片（附體式縮圖） ==================== */
    .step-card-with-img {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .step-card-with-img:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }

    .step-img-box {
      width: 100%;
      height: 190px;
      background: #FFFFFF;
      position: relative;
      border-bottom: 1px solid var(--border-color);
      cursor: zoom-in;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .step-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .step-img-box img.contain-img {
      object-fit: contain;
      padding: 6px;
    }

    .step-text-box {
      padding: 12px 14px;
      font-size: 0.85rem;
      color: var(--text-primary);
      flex: 1;
    }

    /* ==================== 脈輪專屬色彩與位置圖片展示 ==================== */
    .ck-root { background: rgba(229, 62, 62, 0.13); color: #B82E2E; }
    .ck-sacral { background: rgba(237, 137, 54, 0.15); color: #B8521E; }
    .ck-solar { background: rgba(214, 158, 46, 0.16); color: #8F5514; }
    .ck-heart { background: rgba(56, 161, 105, 0.14); color: #246345; }
    .ck-throat { background: rgba(49, 130, 206, 0.14); color: #2864A4; }
    .ck-thirdeye { background: rgba(90, 103, 216, 0.15); color: #3F3D88; }
    .ck-crown { background: rgba(159, 122, 234, 0.15); color: #6440B5; }

    .chakra-card-full {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-card);
      border-left: 6px solid var(--ck-color, var(--accent-primary));
    }

    .chakra-top-layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 20px;
      align-items: center;
      margin-top: 12px;
    }

    .chakra-pos-figure {
      background: #E8C7C2;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      text-align: center;
      cursor: zoom-in;
      box-shadow: var(--shadow-card);
    }

    .chakra-pos-figure img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
    }

    .chakra-pos-caption {
      background: var(--bg-card);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 6px 8px;
      color: var(--text-primary);
      border-top: 1px solid var(--border-color);
    }

    .chakra-slides-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border-color);
    }

    .chakra-slide-thumb {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      cursor: zoom-in;
      transition: transform 0.2s;
    }

    .chakra-slide-thumb:hover {
      transform: translateY(-2px);
    }

    .chakra-slide-thumb img {
      width: 100%;
      height: 135px;
      object-fit: cover;
      display: block;
    }

    .chakra-slide-label {
      font-size: 0.76rem;
      font-weight: 600;
      padding: 6px 10px;
      color: var(--text-secondary);
      text-align: center;
    }

    .chakra-states-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .state-box {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .state-box h4 {
      font-size: 0.86rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .state-box p {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* ==================== 呼吸法與互動計時器 ==================== */
    .pacer-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-card);
      text-align: center;
    }

    .pacer-circle-wrap {
      width: 165px;
      height: 165px;
      margin: 16px auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pacer-circle {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: var(--bg-accent-soft);
      border: 3px solid var(--accent-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 1s linear, background-color 0.5s ease;
    }

    .pacer-phase {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-primary);
    }

    .pacer-sec {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .btn-primary {
      background: var(--accent-primary);
      color: #FFFFFF;
      border: none;
      padding: 10px 22px;
      border-radius: var(--radius-pill);
      font-size: 0.92rem;
      font-weight: 600;
      font-family: var(--font-body);
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.88;
    }

    /* ==================== 知識資料表格與折疊區塊 ==================== */
    .knowledge-block {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
    }

    .knowledge-block h3 {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      color: var(--text-primary);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--cues-border);
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.88rem;
    }

    .info-table th, .info-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }

    .info-table th {
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-weight: 600;
    }

    /* ==================== 彈出詳情視窗 (Modal) ==================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      max-width: 760px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    .modal-close {
      position: sticky;
      top: 0;
      float: right;
      background: var(--accent-primary);
      color: #FFFFFF;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-hero-img {
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      background: #F8EFEA;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      margin: 12px 0;
      display: block;
    }

    .detail-section {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border-color);
    }

    .detail-section h4 {
      font-size: 0.95rem;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .detail-list {
      padding-left: 18px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .detail-list li {
      margin-bottom: 5px;
    }

    /* ==================== 手機底部固定導覽列 ==================== */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-header);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-color);
      z-index: 1200;
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
      justify-content: space-around;
    }

    .mob-tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 0.72rem;
      font-weight: 600;
      font-family: var(--font-body);
      padding: 5px 2px;
      cursor: pointer;
    }

    .mob-tab.active {
      color: var(--accent-primary);
    }

    .mob-tab-icon {
      font-size: 1.18rem;
    }

    @media (max-width: 820px) {
      .nav-tabs {
        display: none;
      }
      .mobile-bottom-nav {
        display: flex;
      }
      .search-box {
        max-width: 100%;
      }
      .cards-grid {
        grid-template-columns: 1fr;
      }
      .chakra-top-layout {
        grid-template-columns: 1fr;
      }
      .chakra-pos-figure {
        max-width: 220px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>

  <!-- 主視覺橫幅 -->
  <header class="hero-banner">
    <div class="hero-inner">
      <div class="hero-badge">🧘‍♀️ NEPAL AUTHENTIC YOGA・隨身數位圖解寶典</div>
      <h1 class="hero-title">尼泊爾正宗瑜伽・隨身查詢小程式</h1>
      <p class="hero-subtitle">
        完整收錄 53 個體式正位圖解（35 個核心講義體式 ＋ 12 個去字放大修復／肩頸脊椎體式 ＋ 6 個拜日／拜月擴充體式）、傳統 12 式拜日式、17 式拜月式、10 套 20 分鐘主題練習序列、七大脈輪位置圖解、10 大呼吸法與 14 大瑜伽種類流派全指南。
      </p>
    </div>
  </header>

  <!-- 主要內容容器 -->
  <main class="main-container">
    <!-- 導覽分頁與搜尋 -->
    <div class="top-controls">
      <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('asanas')" id="tab-asanas">
          🧘 1. 瑜伽體式圖解 <span class="nav-count">53體式 + 拜日/拜月 + 10序列</span>
        </button>
        <button class="nav-tab" onclick="switchTab('chakras')" id="tab-chakras">
          🌈 2. 七大脈輪位置圖 <span class="nav-count">7脈輪圖解</span>
        </button>
        <button class="nav-tab" onclick="switchTab('pranayama')" id="tab-pranayama">
          🌬️ 3. 呼吸法 <span class="nav-count">10種呼吸法</span>

                <tr><td><strong>第四肢｜Pranayama 呼吸法</strong></td><td>Prana(生命能量) + Ayama(延展)，延長呼吸並擴展生命能量</td><td>呼吸控制練習，連結肉身與能量層</td></tr>
                <tr><td><strong>第五肢｜Pratyahara 收攝</strong></td><td>把感官向內收縮，將注意力從「外在」轉移回「內在」</td><td>活在當下，覺察自己的存在</td></tr>
                <tr><td><strong>第六肢｜Dharana 專注</strong></td><td>專注於單一物品或思想，訓練穩定心念（克服雜念分心）</td><td>例如：凝視燭火、觀察鼻尖、專注呼吸，掌握後即可進入冥想</td></tr>
                <tr><td><strong>第七肢｜Dhyana 冥想/禪定</strong></td><td>延續第六肢專注(Dharana)的狀態，將心持續專注、更加穩定深入</td><td>做瑜伽體位法時專注呼吸、身體動作、覺察當下意識</td></tr>
                <tr><td><strong>第八肢｜Samadhi 三摩地</strong></td><td>最終的覺知、最深層的冥想，與萬物合一的境界</td><td>超越二元對立，體驗純粹覺知</td></tr>
              </tbody>
            </table>
          </div>
        `);
      }

      if (currentKnowledgeFilter === "all" || currentKnowledgeFilter === "kosha") {
        blocks.push(`
          <div class="knowledge-block">
            <h3>🧅 五層身體理論圖解：Pancha Kosha (層鞘)（出自《01-2》）</h3>
            <div style="margin-bottom:14px; cursor:zoom-in;" onclick="openImageLightbox('yoga_images/theory_kosha.jpg', '五層身體 Koshas 層鞘圖解（講義原圖）')">
              <img src="yoga_images/theory_kosha.jpg" alt="五層身體圖解" style="width:100%; max-width:680px; border-radius:14px; border:1px solid var(--border-color); display:block; margin:0 auto;" />
            </div>
            <p style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:12px;">
              <strong>Koshas（層鞘）</strong>指覆蓋在靈魂外圍的五個能量層，就像一層層洋蔥皮一樣，包裹著我們的靈魂真我（Atman）：
            </p>
            <div style="overflow-x:auto;">
              <table class="info-table">
                <thead>
                  <tr>
                    <th>層次名稱</th>
                    <th>梵語名稱</th>
                    <th>組成與涵蓋範圍</th>
                    <th>滋養與平衡方式</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td><strong>1. 實體身體 (Physical Body)</strong></td>
                    <td>Annamaya Kosha (肉身層)</td>
                    <td>由食物組成的物質身體（看得見摸得著：器官、神經系統、肌肉骨架）</td>
                    <td>運動、瑜伽體位法 (Asanas)、健康飲食、充足睡眠</td>
                  </tr>
                  <tr>
                    <td><strong>2. 能量身體 (Energy Body)</strong></td>
                    <td>Pranamaya Kosha (能量層)</td>
                    <td>由生命能量組成（含五種生命之氣：命根氣、下行氣、平行氣、上行氣、遍行氣）</td>
                    <td>透過「呼吸法 (Pranayama)」獲得與擴展能量</td>
                  </tr>
                  <tr>
                    <td><strong>3. 情緒身體 (Mental Body)</strong></td>
                    <td>Manomaya Kosha (心智層)</td>
                    <td>由思想、情緒、記憶組成，感受快樂、悲傷、恐懼、平靜等情緒</td>
                    <td>冥想、呼吸法、正念練習</td>
                  </tr>
                  <tr>
                    <td><strong>4. 智慧身體 (Wisdom Body)</strong></td>
                    <td>Vijnanamaya Kosha (智慧層)</td>
                    <td>內在智慧、直覺、自我覺察的層面；負責做出明智決定、分辨對錯</td>
                    <td>冥想、日常的覺知練習</td>
                  </tr>
                  <tr>
                    <td><strong>5. 神性身體 (Bliss Body)</strong></td>
                    <td>Anandamaya Kosha (喜悅層)</td>
                    <td>靈魂最深處的喜悅與平靜；非來自外界，而是內在自然湧出的無條件幸福感</td>
                    <td>長期瑜伽修習、內省、與靈魂連結</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        `);
      }

      if (currentKnowledgeFilter === "all" || currentKnowledgeFilter === "therapy") {
        blocks.push(`
          <div class="knowledge-block">
            <h3>💻 修復瑜珈心法、脊椎減壓原理與電腦族工位指南</h3>
            <div class="chakra-states-grid">
              <div class="state-box">
                <h4>🌙 修復瑜珈三大核心關鍵</h4>
                <p>1. <strong>臣服於重力：</strong>不強求拉筋深度，任由大地接住重量。<br/>
                2. <strong>拉長呼氣節奏：</strong>呼氣多於吸氣，切換至副交感修復模式。<br/>
                3. <strong>保持溫暖無痛：</strong>添蓋毛毯並以抱枕支撐懸空關節，防止肌肉防禦性收縮。</p>
              </div>
              <div class="state-box">
                <h4>🦴 脊椎修復三大生理機制</h4>
                <p>1. <strong>椎間盤滲吸滋養：</strong>藉輕柔屈伸扭轉壓力差導入水分與養分。<br/>
                2. <strong>胸腰筋膜重置：</strong>被動重力牽引解除久坐深層筋膜黏連。<br/>
                3. <strong>交感神經降載：</strong>規律呼吸與脊柱放鬆安撫脊椎旁神經節。</p>
              </div>
              <div class="state-box">
                <h4>⚠️ 肩頸修復三大安全防線</h4>
                <p>1. <strong>嚴禁暴力後折：</strong>後仰會痛代表小面關節擠壓，先建立胸椎延展。<br/>
                2. <strong>幅度減半慢動：</strong>降至平時一半速度，停在微酸舒適範圍。<br/>
                3. <strong>警覺神經症狀：</strong>若伴隨手臂發麻、觸電感或無力，立即停練就醫。</p>
              </div>
              <div class="state-box">
                <h4>🖥️ 預防復發三大辦公微調</h4>
                <p>1. <strong>螢幕頂端平視：</strong>平視落在螢幕上方1/3，杜絕下巴前傾。<br/>
                2. <strong>手肘穩定有托：</strong>打字手肘平靠扶手或桌面，避免斜方肌懸吊。<br/>
                3. <strong>45分鐘微重置：</strong>定時起身做 3 次收下巴與沉肩繞環。</p>
              </div>
            </div>
          </div>
        `);
      }

      container.innerHTML = blocks.join("");
    }

    function switchTab(tabId) {
      currentTab = tabId;
      document.querySelectorAll(".section-view").forEach(s => s.classList.remove("active"));
      document.getElementById("view-" + tabId).classList.add("active");

      document.querySelectorAll(".nav-tab").forEach(t => t.classList.remove("active"));
      document.getElementById("tab-" + tabId).classList.add("active");

      document.querySelectorAll(".mob-tab").forEach(t => t.classList.remove("active"));
      document.getElementById("mob-" + tabId).classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function filterAsanas(cat, btn) {
      currentAsanaFilter = cat;
      currentFlowTopic = "all";
      document.querySelectorAll("#flow-sub-filters .filter-chip").forEach((b, idx) => {
        b.classList.toggle("active", idx === 0);
      });
      document.querySelectorAll("#asana-filters .filter-chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderAsanas();
    }

    function filterFlowTopic(topicId, btn) {
      currentFlowTopic = topicId;
      document.querySelectorAll("#flow-sub-filters .filter-chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderFlowsList();
    }

    function filterChakras(ck, btn) {
      currentChakraFilter = ck;
      btn.parentElement.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderChakras();
    }

    function filterPranayama(code, btn) {
      currentPranayamaFilter = code;
      document.querySelectorAll("#pranayama-filters .filter-chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderPranayama();
    }

    function filterKnowledge(k, btn) {
      currentKnowledgeFilter = k;
      btn.parentElement.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderKnowledge();
    }

    function handleSearch(val) {
      searchQuery = val.trim();
      document.getElementById("search-clear-btn").style.display = searchQuery ? "block" : "none";
      renderAsanas();
      renderChakras();
      renderPranayama();
      renderKnowledge();
    }

    function clearSearch() {
      const input = document.getElementById("global-search");
      input.value = "";
      handleSearch("");
    }

    // ==================== 呼吸計時器邏輯 ====================
    let breathConfig = { in: 4, hold: 0, out: 6 };
    let pacerInterval = null;
    let pacerRunning = false;

    function setBreathMode(inSec, holdSec, outSec, label, btn) {
      breathConfig = { in: inSec, hold: holdSec, out: outSec };
      document.getElementById("breath-mode-title").textContent = "目前模式：" + label;
      btn.parentElement.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      if (pacerRunning) {
        stopPacer();
        startPacer();
      }
    }

    function togglePacer() {
      if (pacerRunning) stopPacer();
      else startPacer();
    }

    function startPacer() {
      pacerRunning = true;
      document.getElementById("pacer-toggle-btn").textContent = "⏹ 停止呼吸引導";
      let phase = "in";
      let remaining = breathConfig.in;
      const circle = document.getElementById("pacer-circle");
      const phaseEl = document.getElementById("pacer-phase");
      const secEl = document.getElementById("pacer-sec");

      function updateUI() {
        if (phase === "in") {
          phaseEl.textContent = "吸氣 Inhale";
          circle.style.transform = "scale(1.38)";
        } else if (phase === "hold") {
          phaseEl.textContent = "屏息鎖 Hold";
          circle.style.transform = "scale(1.38)";
        } else {
          phaseEl.textContent = "呼氣 Exhale";
          circle.style.transform = "scale(0.92)";
        }
        secEl.textContent = remaining + "s";
      }

      updateUI();
      pacerInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          if (phase === "in") {
            if (breathConfig.hold > 0) {
              phase = "hold";
              remaining = breathConfig.hold;
            } else {
              phase = "out";
              remaining = breathConfig.out;
            }
          } else if (phase === "hold") {
            phase = "out";
            remaining = breathConfig.out;
          } else {
            phase = "in";
            remaining = breathConfig.in;
          }
        }
        updateUI();
      }, 1000);
    }

    function stopPacer() {
      pacerRunning = false;
      clearInterval(pacerInterval);
      document.getElementById("pacer-toggle-btn").textContent = "▶ 開始呼吸引導";
      document.getElementById("pacer-phase").textContent = "準備";
      document.getElementById("pacer-sec").textContent = "0s";
      document.getElementById("pacer-circle").style.transform = "scale(1)";
    }

    // 初始化渲染
    renderAsanas();
    renderChakras();
    renderPranayama();
    renderKnowledge();
  </script>
</body>
</html>
